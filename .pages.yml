# Configuración de Pages CMS (https://pagescms.org): el editor visual
# con el que se cambia el contenido sin tocar archivos a mano.
# Cada bloque de "content" es una pantalla del editor y apunta a un
# archivo o carpeta de contenido/.

media:
  input: contenido/imagenes
  output: /contenido/imagenes
  categories: [image]

content:
  - name: sitio
    label: Datos generales
    type: file
    path: contenido/sitio.yaml
    fields:
      - { name: titulo, label: Título del libro, type: string, required: true }
      - { name: autor, label: Autor (nombre corto), type: string, required: true }
      - { name: genero, label: Género, type: string, required: true }
      - { name: editorial, label: Editorial, type: string, required: true }
      - name: lema
        label: Lema bajo el título (una línea por renglón)
        type: string
        list: true
      - name: gancho
        label: Gancho (una línea por renglón)
        type: string
        list: true
      - { name: frase, label: Frase al pie del libro, en el inicio, type: string }
      - { name: portada, label: Imagen de la portada, type: image, required: true }
      - { name: portada_descripcion, label: Descripción de la portada (para lectores de pantalla), type: string, required: true }
      - name: descripcion_buscadores
        label: Descripción para Google y redes sociales
        type: text
        required: true
        description: Una o dos frases. Es el texto que aparece al compartir el enlace.
      - name: personajes
        label: Sección Personajes
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string, required: true }
          - { name: titular, label: Titular, type: string, required: true }
      - name: banda_sonora
        label: Sección Banda sonora
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string, required: true }
          - { name: titular, label: Titular, type: string, required: true }
          - { name: texto, label: Texto, type: text, required: true }
          - { name: enlace, label: Enlace a la playlist, type: string }
          - { name: enlace_texto, label: Texto del botón, type: string }
      - name: encuentros
        label: Sección Encuentros
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string, required: true }
          - { name: titular, label: Titular, type: string, required: true }
          - { name: sin_fechas, label: Texto cuando no hay fechas anunciadas, type: text, required: true }
      - name: interludio
        label: Nota junto a la biografía del autor
        type: object
        fields:
          - { name: titular, label: Titular, type: string }
          - { name: texto, label: Texto, type: text }
      - name: contacto
        label: Sección Contacto
        type: object
        fields:
          - { name: etiqueta, label: Etiqueta, type: string, required: true }
          - { name: titular, label: Titular, type: string, required: true }
          - { name: texto, label: Texto, type: text }
          - name: clave_web3forms
            label: Clave de Web3Forms
            type: string
            description: La clave que Web3Forms envía por correo. Sin ella el formulario no manda mensajes.

  - name: novela
    label: La novela
    type: file
    path: contenido/novela.md
    fields:
      - { name: etiqueta, label: Etiqueta, type: string, required: true }
      - { name: titular, label: Titular, type: string, required: true }
      - { name: body, label: Sinopsis, type: rich-text, options: { format: markdown } }
      - { name: cita, label: Cita destacada, type: text }
      - { name: cierre, label: Línea de cierre bajo la cita, type: string }

  - name: universo
    label: El universo
    type: file
    path: contenido/universo.md
    fields:
      - { name: etiqueta, label: Etiqueta, type: string, required: true }
      - { name: titular, label: Titular, type: string, required: true }
      - { name: body, label: Introducción, type: rich-text, options: { format: markdown } }
      - name: datos
        label: Datos (Ambientación, Temas…)
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: texto, label: Texto, type: text, required: true }

  - name: personajes
    label: Personajes
    type: collection
    path: contenido/personajes
    filename: '{primary}.md'
    view:
      fields: [nombre, rol, orden]
      primary: nombre
      sort: [orden]
      default: { sort: orden, order: asc }
    fields:
      - { name: nombre, label: Nombre, type: string, required: true }
      - { name: rol, label: Rol (una o dos palabras), type: string }
      - name: orden
        label: Orden
        type: number
        description: Los números bajos salen primero. El 1 se muestra destacado.
      - name: foto
        label: Foto (cara del personaje)
        type: image
        description: Opcional. Mejor cuadrada, de la cara y los hombros. Se ve pequeña junto al nombre y se agranda al tocarla.
      - { name: body, label: Descripción, type: rich-text, options: { format: markdown } }

  - name: canciones
    label: Banda sonora (canciones)
    type: file
    path: contenido/canciones.yaml
    fields:
      - name: lista
        label: Canciones, en orden de reproducción
        type: object
        list: true
        fields:
          - { name: titulo, label: Título, type: string, required: true }
          - { name: artista, label: Intérprete, type: string }
          - name: video
            label: Código de YouTube
            type: string
            required: true
            pattern: { regex: '^[A-Za-z0-9_-]{11}$', message: 'Son 11 caracteres: lo que va después de "v=" en el enlace de la canción.' }
          - { name: duracion, label: 'Duración (por ejemplo 3:05)', type: string }

  - name: librerias
    label: Dónde conseguirla
    type: file
    path: contenido/librerias.yaml
    fields:
      - { name: etiqueta, label: Etiqueta, type: string, required: true }
      - { name: titular, label: Titular, type: string, required: true }
      - name: lista
        label: Librerías
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string, required: true }
          - { name: lugar, label: Lugar, type: string }
          - name: enlace
            label: Página del libro en su tienda en línea (opcional)
            type: string
            description: Si se deja vacío, se muestra "En tienda".

  - name: directorio
    label: Directorio de otras librerías
    type: file
    path: contenido/directorio.yaml
    fields:
      - { name: titulo, label: Título del bloque plegado, type: string, required: true }
      - { name: texto, label: Texto de introducción, type: text }
      - { name: asunto, label: Asunto del correo ya redactado, type: string, required: true }
      - { name: mensaje, label: Texto del correo ya redactado, type: text, required: true }
      - name: lista
        label: Librerías
        type: object
        list: true
        fields:
          - { name: nombre, label: Nombre, type: string, required: true }
          - { name: municipio, label: Municipio, type: string, required: true }
          - { name: telefono, label: Teléfono, type: string, description: 'Con guiones: 787-555-1234' }
          - { name: correo, label: Correo electrónico, type: string }
          - { name: enlace, label: Página web (o Facebook o Instagram si no tiene), type: string }

  - name: encuentros
    label: Encuentros
    type: collection
    path: contenido/encuentros
    filename: '{fields.fecha}-{primary}.md'
    view:
      fields: [titulo, fecha, lugar]
      primary: titulo
      sort: [fecha]
      default: { sort: fecha, order: desc }
    fields:
      - { name: titulo, label: Título, type: string, required: true }
      - name: fecha
        label: Fecha
        type: date
        required: true
        description: Al pasar la fecha, el encuentro deja de mostrarse solo.
      - { name: hora, label: Hora, type: string, description: 'Por ejemplo: Desde las 10:00 a. m.' }
      - { name: lugar, label: Lugar, type: string, required: true }
      - { name: direccion, label: Dirección, type: string }
      - name: mapa
        label: Enlace al mapa (opcional)
        type: string
        description: Si se deja vacío, el sitio crea solo un enlace a Google Maps con el lugar y la dirección.
      - name: enlace
        label: Enlace con más información (opcional)
        type: string
        description: Por ejemplo, la página del evento. Debe empezar con https://
      - { name: enlace_texto, label: Texto de ese enlace, type: string, description: 'Si se deja vacío dice "Más información".' }
      - name: visible_desde
        label: Mostrar la tarjeta desde
        type: date
        description: Opcional. Antes de este día la tarjeta queda guardada pero no se ve. Vacío = se ve desde que se publica.
      - name: visible_hasta
        label: Mostrar la tarjeta hasta
        type: date
        description: Opcional. Después de este día la tarjeta se oculta sola. Vacío = hasta el día del encuentro.
      - { name: body, label: Detalles (opcional), type: rich-text, options: { format: markdown } }

  - name: autor
    label: El autor
    type: file
    path: contenido/autor.md
    fields:
      - { name: etiqueta, label: Etiqueta, type: string, required: true }
      - { name: nombre, label: Nombre completo, type: string, required: true }
      - { name: foto, label: Foto, type: image }
      - { name: foto_descripcion, label: Descripción de la foto (para lectores de pantalla), type: string }
      - { name: body, label: Biografía, type: rich-text, options: { format: markdown } }
      - { name: proyectos_titulo, label: Título del bloque de proyectos, type: string }
      - { name: proyectos_texto, label: Texto del bloque de proyectos, type: text }
