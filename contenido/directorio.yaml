# Otras librerías de Puerto Rico, para que el lector pueda encargar la
# novela en la que le quede cerca. Se muestran agrupadas por municipio.
# Para añadir una, copia un bloque. "telefono", "correo" y "enlace" son
# opcionales, pero conviene poner al menos uno. En "enlace" vale la página
# web o, si no tiene, su Facebook o Instagram.

titulo: Pídela en tu librería
texto: >-
  Si tu librería no aparece arriba, puedes encargársela. Elige tu municipio,
  llama o envía el correo que ya dejamos escrito con los datos del libro.

# Correo que se abre ya redactado al pulsar "Pedir por correo"
asunto: Consulta sobre la novela «Legión», de Efraín A. Flores Acosta
mensaje: |
  Saludos:

  Me interesa conseguir la novela «Legión: Porque a veces, el enemigo no viene de fuera», de Efraín A. Flores Acosta (Publicaciones Gaviota, ISBN 978-1-61505-681-1).

  ¿La tienen disponible o podrían encargarla? De ser así, les agradeceré que me indiquen el precio y cómo recogerla o recibirla.

  Gracias.

